# Training Configuration (optimized for 1-2 hour completion)
training:
  # Number of training epochs (reduced for faster completion)
  num_train_epochs: 1
  
  # Learning rate
  learning_rate: 2.0e-4
  
  # Warmup steps
  warmup_steps: 100
  
  # Logging frequency (steps) - increased to reduce overhead
  logging_steps: 25
  
  # Save frequency (steps) - reduced for faster training
  save_steps: 500
  
  # Evaluation frequency (steps) - reduced for faster training
  eval_steps: 500
  
  # Maximum training steps (optimized for 2-3 hour completion)
  max_steps: 800
  
  # Gradient checkpointing (enables memory efficiency)
  gradient_checkpointing: true
  
  # Gradient accumulation steps (reduced for 4x faster step speed)
  gradient_accumulation_steps: 4
  
  # Per device batch size (keep 1 to prevent OOM on T4 GPU)
  per_device_train_batch_size: 1
  
  # Per device eval batch size
  per_device_eval_batch_size: 1
  
  # Number of dataloader workers (increased to use RAM fully)
  dataloader_num_workers: 4
  
  # Max gradient norm for clipping
  max_grad_norm: 1.0
  
  # Weight decay
  weight_decay: 0.01
  
  # Optimizer type
  optim: "paged_adamw_8bit"
  
  # Scheduler type
  lr_scheduler_type: "cosine"
  
  # Precision (fp16, bf16, or no)
  fp16: true
  bf16: false
  
  # Disable TQDM
  disable_tqdm: false
  
  # Load best model
  load_best_model_at_end: true
  
  # Metric for best model
  metric_for_best_model: "eval_loss"
  
  # Greater is better
  greater_is_better: false
  
  # Save total limit
  save_total_limit: 3
  
  # Report to
  report_to: ["tensorboard", "wandb"]
  
  # Seed
  seed: 42

# LoRA Configuration
lora:
  # LoRA rank
  r: 16
  
  # LoRA alpha
  lora_alpha: 32
  
  # LoRA dropout
  lora_dropout: 0.05
  
  # Target modules
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  
  # Bias (none, all, lora_only)
  bias: "none"
  
  # Task type
  task_type: "CAUSAL_LM"