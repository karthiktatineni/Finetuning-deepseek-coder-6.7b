# Dataset Configuration
datasets:
  # List of datasets to download and process
  # Based on actual downloaded datasets in cloud/datasets/raw/
  sources:
    - name: "opencoder_stage1"
      format: "huggingface"
      instruction_field: "instruction"
      response_field: "output"
      max_samples: 400000  # 400k samples max
      priority: 1
  
    - name: "opencoder_stage2"
      format: "huggingface"
      instruction_field: "instruction"
      response_field: "output"
      max_samples: 400000  # 400k samples max
      priority: 2
  
    - name: "codealpaca"
      format: "huggingface"
      instruction_field: "instruction"
      response_field: "output"
      max_samples: 0  # Use remaining to reach 850k total
      priority: 3
  
    - name: "apps"
      format: "huggingface"
      instruction_field: "question"
      response_field: "solutions"
      max_samples: 0  # Process all samples
      priority: 4
  
    - name: "codesearchnet"
      format: "huggingface"
      instruction_field: "func_documentation_string"
      response_field: "code"
      max_samples: 0  # Process all samples
      priority: 5
  
    - name: "alpaca_data_cleaned.json"
      format: "json"
      instruction_field: "instruction"
      response_field: "output"
      max_samples: 0  # Process all samples
      priority: 6
  
    - name: "code_alpaca_20k.json"
      format: "json"
      instruction_field: "instruction"
      response_field: "output"
      max_samples: 0  # Process all samples
      priority: 7
  
    - name: "classeval"
      format: "huggingface"
      instruction_field: "instruction"
      response_field: "code"
      max_samples: 0  # Process all samples
      priority: 8
      eval_only: true  # Evaluation only, not for training

  # Dataset merging configuration
  merging:
    # Merge strategy: "concat", "sample", "weighted"
    strategy: "concat"
    
    # Maximum samples to prevent OOM (set to 0 for unlimited)
    max_samples: 850000  # Total training samples: 400k + 400k + 50k = 850k
    
    # Target total samples
    target_total_samples: 850000  # Use exactly 850k samples
    
    # Weights for weighted sampling (prioritize coding quality)
    weights:
      opencoder_stage1: 2.0      # Highest quality pre-training data (400k target)
      opencoder_stage2: 2.5      # Highest quality fine-tuning data (400k target)
      codealpaca: 1.2           # Pure coding instructions (rest to reach 850k)
      apps: 1.3                 # Competitive programming
      codesearchnet: 1.1        # Code-documentation pairs
      alpaca_data_cleaned.json: 1.0  # General instructions
      code_alpaca_20k.json: 1.4      # Pure coding instructions

# Preprocessing configuration  
preprocessing:
  # Max samples per dataset for testing (0 = all samples)
  max_samples: 0
  
  # Shuffle dataset after merge
  shuffle: true
  
  # Random seed for shuffling
  seed: 42
  
  # Train/validation split
  train_split: 0.95
  
  # Text normalization
  normalize_text: true
  
  # Remove duplicates
  remove_duplicates: true
  
  # Max length percentage warning
  max_length_warning_threshold: 0.95

# Tokenization configuration
tokenization:
  # Max sequence length
  max_seq_length: 4096
  
  # Truncation strategy
  truncation: true
  
  # Padding strategy
  padding: "max_length"
  
  # Return attention mask
  return_attention_mask: true
  
  # Return token type ids
  return_token_type_ids: false